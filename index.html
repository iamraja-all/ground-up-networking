<style>
  :root{
    color-scheme: light dark;
    --bg:#f2f4f8; --surface:#ffffff; --surface-2:#eceff5; --surface-3:#e3e7f0;
    --ink:#1b2130; --ink-soft:#586178; --ink-faint:#8b93a8;
    --line:#e0e4ee; --line-soft:#eaedf4;
    --accent:#4f46e5; --accent-strong:#4338ca; --accent-soft:#ebe9fd; --accent-line:#cdc9f6;
    --ok:#15803d; --ok-bg:#dcf5e5; --ok-line:#9be3b6;
    --block:#d63030; --block-bg:#fde4e2; --block-line:#f4b3ad;
    --caution:#b45309; --caution-bg:#fbefd3; --caution-line:#eecf8f;
    --shadow-sm:0 1px 2px rgba(20,25,40,.05);
    --shadow-md:0 4px 20px -8px rgba(20,25,40,.18);
    --shadow-lg:0 18px 50px -14px rgba(20,25,40,.32);
    --sans:-apple-system,"Segoe UI Variable Display","Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
    --mono:"Cascadia Code","JetBrains Mono","SF Mono",ui-monospace,Consolas,"Liberation Mono",monospace;
    --r:14px; --r-sm:9px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0c0f16; --surface:#141924; --surface-2:#1b2130; --surface-3:#232b3c;
      --ink:#e8ebf3; --ink-soft:#a3adc2; --ink-faint:#6a7488;
      --line:#252d3d; --line-soft:#1e2532;
      --accent:#8b85f6; --accent-strong:#a49ff9; --accent-soft:#1d1b3a; --accent-line:#332e63;
      --ok:#43d17f; --ok-bg:#0f2a1b; --ok-line:#1f5236;
      --block:#f6736b; --block-bg:#2c1615; --block-line:#5a2622;
      --caution:#f0b23f; --caution-bg:#2a2210; --caution-line:#4c3d17;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 6px 24px -10px rgba(0,0,0,.6);
      --shadow-lg:0 20px 56px -14px rgba(0,0,0,.72);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0f16; --surface:#141924; --surface-2:#1b2130; --surface-3:#232b3c;
    --ink:#e8ebf3; --ink-soft:#a3adc2; --ink-faint:#6a7488;
    --line:#252d3d; --line-soft:#1e2532;
    --accent:#8b85f6; --accent-strong:#a49ff9; --accent-soft:#1d1b3a; --accent-line:#332e63;
    --ok:#43d17f; --ok-bg:#0f2a1b; --ok-line:#1f5236;
    --block:#f6736b; --block-bg:#2c1615; --block-line:#5a2622;
    --caution:#f0b23f; --caution-bg:#2a2210; --caution-line:#4c3d17;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 24px -10px rgba(0,0,0,.6);
    --shadow-lg:0 20px 56px -14px rgba(0,0,0,.72);
  }
  :root[data-theme="light"]{
    --bg:#f2f4f8; --surface:#ffffff; --surface-2:#eceff5; --surface-3:#e3e7f0;
    --ink:#1b2130; --ink-soft:#586178; --ink-faint:#8b93a8;
    --line:#e0e4ee; --line-soft:#eaedf4;
    --accent:#4f46e5; --accent-strong:#4338ca; --accent-soft:#ebe9fd; --accent-line:#cdc9f6;
    --ok:#15803d; --ok-bg:#dcf5e5; --ok-line:#9be3b6;
    --block:#d63030; --block-bg:#fde4e2; --block-line:#f4b3ad;
    --caution:#b45309; --caution-bg:#fbefd3; --caution-line:#eecf8f;
    --shadow-sm:0 1px 2px rgba(20,25,40,.05);
    --shadow-md:0 4px 20px -8px rgba(20,25,40,.18);
    --shadow-lg:0 18px 50px -14px rgba(20,25,40,.32);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  #app{display:flex;height:100dvh;overflow:hidden}
  #rail{width:262px;flex:0 0 262px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  body.hub-mode #rail{display:none}
  .rail-top{padding:16px 18px 12px;border-bottom:1px solid var(--line-soft)}
  .brand{display:flex;align-items:center;gap:11px}
  .brand-mark{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:linear-gradient(150deg,var(--accent),var(--accent-strong));display:grid;place-items:center;box-shadow:var(--shadow-sm)}
  .brand-mark svg{width:19px;height:19px;color:#fff}
  .brand-name{font-weight:750;font-size:15px;letter-spacing:-.01em}
  .brand-sub{font-size:11px;color:var(--ink-faint);margin-top:1px}
  .rail-back{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:none;color:var(--ink-soft);font-size:13px;font-weight:600;padding:12px 18px;border-bottom:1px solid var(--line-soft)}
  .rail-back:hover{background:var(--surface-2);color:var(--ink)}
  .rail-back svg{width:15px;height:15px}
  .rail-scroll{flex:1;overflow-y:auto;padding:10px 10px 20px}
  .rail-h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);padding:12px 10px 8px}
  .rung{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:none;color:var(--ink-soft);padding:9px 10px;border-radius:10px;font-size:13.5px;line-height:1.35}
  .rung:hover:not(:disabled){background:var(--surface-2)}
  .rung:disabled{opacity:.4;cursor:not-allowed}
  .rung.current{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
  .rung-dot{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-family:var(--mono);color:var(--ink-faint);background:var(--surface)}
  .rung.current .rung-dot{border-color:var(--accent);color:var(--accent-strong)}
  .rung.done .rung-dot{background:var(--ok);border-color:var(--ok);color:#fff}
  .rung.done .rung-dot svg{width:12px;height:12px}

  #main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .topbar{display:flex;align-items:center;gap:14px;padding:13px 24px;border-bottom:1px solid var(--line);background:var(--surface);min-height:60px}
  .tb-title{font-weight:700;font-size:15px}
  .tb-sub{color:var(--ink-faint);font-size:12.5px}
  .prog{flex:1;height:7px;background:var(--surface-2);border-radius:100px;overflow:hidden;max-width:300px}
  .prog span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-strong));border-radius:100px;transition:width .35s}
  .prog-num{font-family:var(--mono);font-size:12px;color:var(--ink-faint);white-space:nowrap}
  .icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink)}
  .icon-btn svg{width:17px;height:17px}
  .tb-back{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:600}
  .tb-back:hover{background:var(--surface-2)}
  .tb-back svg{width:15px;height:15px}
  .nav-spacer{flex:1}

  #stage{flex:1;overflow-y:auto;overflow-x:hidden}

  /* ===== hub ===== */
  .hub{max-width:720px;margin:0 auto;padding:44px 26px 90px}
  .hub-hero h1{font-size:34px;letter-spacing:-.025em;margin:0 0 10px;font-weight:800;text-wrap:balance}
  .hub-hero p{font-size:16.5px;color:var(--ink-soft);margin:0 0 6px;max-width:56ch;line-height:1.6}
  .hub-hero .tag{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-strong);font-weight:600;margin-bottom:16px;display:inline-block}
  .path{margin-top:34px;position:relative}
  .lcard{display:flex;gap:18px;align-items:stretch;position:relative;padding-bottom:16px}
  .lcard .spine{display:flex;flex-direction:column;align-items:center;flex:0 0 44px}
  .lnum{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:750;font-size:17px;background:var(--surface);border:2px solid var(--line);color:var(--ink-faint);z-index:1}
  .lcard.ready .lnum{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}
  .lcard.done .lnum{background:var(--ok);border-color:var(--ok);color:#fff}
  .lcard .connector{flex:1;width:2px;background:var(--line);margin-top:2px}
  .lcard:last-child .connector{display:none}
  .lbody{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px 20px;box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s,box-shadow .12s;text-align:left;color:inherit;margin-bottom:2px}
  button.lbody.clickable{cursor:pointer}
  button.lbody.clickable:hover{border-color:var(--accent-line);box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .lbody.soon{opacity:.72}
  .lbody-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .lbody h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .lbody .sub{color:var(--ink-soft);font-size:14px;margin:0}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:100px;margin-left:auto;white-space:nowrap}
  .chip.start{background:var(--accent-soft);color:var(--accent-strong)}
  .chip.prog{background:var(--caution-bg);color:var(--caution)}
  .chip.done{background:var(--ok-bg);color:var(--ok)}
  .chip.soon{background:var(--surface-2);color:var(--ink-faint)}
  .lprog{height:5px;background:var(--surface-2);border-radius:100px;overflow:hidden;margin-top:12px}
  .lprog span{display:block;height:100%;background:var(--accent);border-radius:100px}
  .hub-foot{margin-top:30px;padding:16px 20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--ink-faint);font-size:13.5px;line-height:1.6}

  /* ===== lesson card ===== */
  .card{max-width:760px;margin:0 auto;padding:38px 30px 30px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:5px 11px;border-radius:100px;margin-bottom:18px}
  .eyebrow.situation{color:var(--accent-strong);background:var(--accent-soft)}
  .eyebrow.predict{color:var(--caution);background:var(--caution-bg)}
  .eyebrow.reveal{color:var(--ok);background:var(--ok-bg)}
  .eyebrow.challenge{color:var(--accent-strong);background:var(--accent-soft)}
  h1.q{font-size:29px;line-height:1.22;letter-spacing:-.02em;margin:0 0 8px;font-weight:750;text-wrap:balance}
  .lede{font-size:16px;color:var(--ink-soft);margin:0 0 22px;max-width:62ch}
  .lede strong{color:var(--ink);font-weight:650}
  code{font-family:var(--mono);font-size:.9em}

  figure.fig{margin:22px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px 14px;box-shadow:var(--shadow-sm)}
  figure.fig svg{display:block;width:100%;height:auto;max-width:100%}
  figcaption{margin-top:12px;font-size:12.5px;color:var(--ink-faint);text-align:center;font-style:italic}
  .fig-scroll{overflow-x:auto}

  .dg-box{fill:var(--surface);stroke:var(--line);stroke-width:1.6}
  .dg-box.accent{stroke:var(--accent);stroke-width:2}
  .dg-box.ok{fill:var(--ok-bg);stroke:var(--ok);stroke-width:2}
  .dg-box.block{fill:var(--block-bg);stroke:var(--block);stroke-width:2}
  .dg-box.caution{fill:var(--caution-bg);stroke:var(--caution);stroke-width:2}
  .dg-box.dashed{stroke-dasharray:5 5;stroke:var(--accent);stroke-width:2}
  .dg-box.hot{stroke:var(--accent);stroke-width:2.6;fill:var(--accent-soft)}
  .dg-box.dim{opacity:.4}
  .dg-label{fill:var(--ink);font:650 14px var(--sans)}
  .dg-em{fill:var(--ink);font:750 17px var(--sans)}
  .dg-sub{fill:var(--ink-faint);font:600 11px var(--mono)}
  .dg-arrow{stroke:var(--ink-faint);stroke-width:1.6;fill:none}
  .dg-arrowlabel{fill:var(--ink-soft);font:600 10.5px var(--mono)}
  .dg-head{fill:var(--ink-faint)}
  .dg-pkt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
  .dg-pkt.ok{fill:var(--ok)} .dg-pkt.block{fill:var(--block)} .dg-pkt.caution{fill:var(--caution)}
  .fx-bar{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
  .fx-play{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:7px 15px;border-radius:9px;font-size:13px;font-weight:600;white-space:nowrap}
  .fx-play:hover{background:var(--accent-strong)}
  .fx-play:disabled{opacity:.55;cursor:default}
  .fx-cap{font-size:13px;color:var(--ink-soft);flex:1;min-width:160px;line-height:1.5}
  .fx-cap .fx-step{display:block;padding:1px 0}
  .dg-q{fill:var(--accent-strong);font:750 26px var(--sans)}
  .dg-eye{fill:var(--caution)}
  .door{cursor:pointer}
  .door rect{fill:var(--surface-2);stroke:var(--ink-faint);stroke-width:1.5;transition:fill .12s}
  .door:hover rect{fill:var(--accent-soft)}
  .door.sel rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
  .door.caution rect{stroke:var(--caution)}
  .door-num{fill:var(--ink);font:700 15px var(--mono);pointer-events:none}
  .door-cap{fill:var(--ink-faint);font:600 10px var(--mono);pointer-events:none}

  .choices{display:flex;flex-direction:column;gap:11px;margin:8px 0 4px}
  .choice{display:flex;align-items:flex-start;gap:13px;text-align:left;background:var(--surface);border:1.6px solid var(--line);border-radius:var(--r);padding:15px 17px;font-size:15px;color:var(--ink);transition:border-color .12s,background .12s;width:100%}
  .choice:hover:not(.locked){border-color:var(--accent-line);background:var(--accent-soft)}
  .choice .key{width:26px;height:26px;flex:0 0 26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:1px}
  .choice.locked{cursor:default}
  .choice.picked-ok{border-color:var(--ok);background:var(--ok-bg)}
  .choice.picked-ok .key{background:var(--ok);color:#fff}
  .choice.picked-bad{border-color:var(--block);background:var(--block-bg)}
  .choice.picked-bad .key{background:var(--block);color:#fff}
  .choice.reveal-ok{border-color:var(--ok)}
  .choice.reveal-ok .key{background:var(--ok);color:#fff}
  .choice .ctext{flex:1}
  .fb{font-size:13.5px;margin-top:7px;line-height:1.5;display:none}
  .choice.show-fb .fb{display:block}
  .choice.picked-ok .fb,.choice.reveal-ok .fb{color:var(--ok)}
  .choice.picked-bad .fb{color:var(--block)}

  .why{margin:20px 0 4px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 var(--r) var(--r) 0;padding:16px 20px;box-shadow:var(--shadow-sm);display:none}
  .why.show{display:block;animation:rise .3s ease}
  .why h4{margin:0 0 6px;font-size:12px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-strong)}
  .why p{margin:0 0 8px;color:var(--ink);font-size:14.5px}
  .why p:last-child{margin:0}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .ruleset{font-family:var(--mono);font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:18px 0;line-height:1.9;white-space:pre-wrap}
  .ruleset .allow{color:var(--ok);font-weight:600}
  .ruleset .block{color:var(--block);font-weight:600}
  .ruleset .cmt{color:var(--ink-faint)}

  .callout{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--caution);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;margin:16px 0;font-size:14px;color:var(--ink-soft)}
  .popup{max-width:340px;margin:18px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden}
  .popup-head{padding:12px 16px;font-size:13px;font-weight:650;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:9px}
  .popup-head svg{width:16px;height:16px;color:var(--accent)}
  .popup-body{padding:14px 16px;font-size:13.5px;color:var(--ink-soft)}
  .popup-actions{display:flex;gap:8px;padding:0 16px 14px}
  .popup-actions .pa{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);text-align:center;font-size:13px;font-weight:600}
  .pa.allow{background:var(--accent);color:#fff;border-color:var(--accent)}

  .drill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow-sm);text-align:center}
  .drill-knock{font-family:var(--mono);font-size:15px;color:var(--ink-soft);margin-bottom:6px}
  .drill-port{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-.02em;margin:4px 0 20px}
  .drill-btns{display:flex;gap:12px;justify-content:center;max-width:360px;margin:0 auto}
  .drill-btns .db{flex:1;padding:14px;border-radius:11px;border:2px solid var(--line);background:var(--surface);font-size:15px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px}
  .db.allow:hover{border-color:var(--ok);color:var(--ok)}
  .db.block:hover{border-color:var(--block);color:var(--block)}
  .db svg{width:17px;height:17px}
  .db:disabled{opacity:.5}
  .drill-fb{margin-top:18px;font-size:14.5px;min-height:24px;font-weight:550}
  .drill-fb.ok{color:var(--ok)} .drill-fb.bad{color:var(--block)}
  .drill-progress{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
  .drill-progress i{width:26px;height:5px;border-radius:100px;background:var(--surface-3)}
  .drill-progress i.ok{background:var(--ok)} .drill-progress i.bad{background:var(--block)} .drill-progress i.cur{background:var(--accent)}

  .trace-q{font-weight:600;font-size:16.5px;margin:0 0 14px}
  .trace-next{margin-top:16px;display:none}
  .trace-next.show{display:block}

  /* simulator (shared) */
  .sim{display:grid;grid-template-columns:1fr;gap:18px}
  .sim-controls{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm)}
  .ctrl-row{margin-bottom:16px}
  .ctrl-row:last-child{margin-bottom:0}
  .ctrl-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .ctrl-label svg{width:14px;height:14px}
  .seg{display:inline-flex;flex-wrap:wrap;gap:6px}
  .seg button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);padding:7px 13px;border-radius:9px;font-size:13px;font-weight:600;font-family:var(--mono)}
  .seg button:hover{border-color:var(--accent-line)}
  .seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
  .seg.gate button.on.allow{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .seg.gate button.on.block{background:var(--block-bg);border-color:var(--block);color:var(--block)}
  .send-btn{width:100%;margin-top:6px;padding:13px;border-radius:11px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px}
  .send-btn:hover{background:var(--accent-strong)}
  .send-btn:disabled{opacity:.55}
  .send-btn svg{width:18px;height:18px}
  .verdict{border-radius:var(--r);padding:15px 18px;font-size:14.5px;display:none;align-items:flex-start;gap:12px}
  .verdict.show{display:flex;animation:rise .3s ease}
  .verdict svg{width:20px;height:20px;flex:0 0 20px;margin-top:1px}
  .verdict.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
  .verdict.block{background:var(--block-bg);color:var(--block);border:1px solid var(--block-line)}
  .verdict.caution{background:var(--caution-bg);color:var(--caution);border:1px solid var(--caution-line)}
  .verdict b{display:block;margin-bottom:2px;font-size:15px}
  .goals{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}

  .reflect-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
  .reflect-item .rq{font-size:15.5px;font-weight:600;margin-bottom:12px}
  .reveal-btn{border:1px dashed var(--accent-line);background:var(--accent-soft);color:var(--accent-strong);padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600}
  .reflect-a{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft);color:var(--ink-soft);font-size:14.5px;line-height:1.6}
  .reflect-a.show{display:block;animation:rise .3s ease}
  .teaser{font-family:var(--mono);font-size:19px;text-align:center;padding:26px;background:var(--surface);border:1px dashed var(--accent-line);border-radius:var(--r);margin:20px 0;letter-spacing:.02em}
  .teaser .glow{color:var(--accent-strong);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

  .navbar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;padding:16px 30px;background:linear-gradient(to top,var(--bg) 62%,transparent);max-width:820px;margin:0 auto;width:100%}
  body.hub-mode .navbar{display:none}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 20px;border-radius:11px;font-size:14.5px;font-weight:600;transition:background .12s,transform .05s}
  .btn:hover{background:var(--surface-2)}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:16px;height:16px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-strong)}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{background:var(--surface-2)}
  .hint{font-size:12.5px;color:var(--ink-faint);font-style:italic}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:100px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100}
  #toast.show{opacity:1;transform:translateX(-50%)}
  .mobile-only{display:none}
  @media (max-width:840px){
    #rail{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow-lg)}
    body.rail-open:not(.hub-mode) #rail{transform:translateX(0);display:flex}
    #scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
    body.rail-open #scrim{display:block}
    .mobile-only{display:grid}
    .card{padding:26px 18px 20px}
    h1.q{font-size:24px}
    .hub{padding:30px 18px 80px}
    .hub-hero h1{font-size:27px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <aside id="rail"></aside>
  <div id="scrim"></div>
  <main id="main">
    <div class="topbar" id="topbar"></div>

    <div class="navbar" id="navbar"></div>
  </main>
</div>
<div id="toast"></div>

<script>
(function(){
  "use strict";
  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const reduced=()=>typeof matchMedia!=="undefined"&&matchMedia("(prefers-reduced-motion:reduce)").matches;

  /* ============ shared SVG helpers ============ */
  const ARROW='<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" class="dg-head"/></marker></defs>';
  function fig(svg,vb,caption,aria){
    return `<figure class="fig"><div class="fig-scroll"><svg class="dg" viewBox="${vb}" role="img" aria-label="${esc(aria||caption)}" preserveAspectRatio="xMidYMid meet">${ARROW}${svg}</svg></div>${caption?`<figcaption>${caption}</figcaption>`:""}</figure>`;
  }
  function chain(nodes,opt){
    opt=opt||{};
    const W=opt.W||760, bw=opt.bw||124, bh=opt.bh||56, y=opt.y||34;
    const n=nodes.length, gap=(W-n*bw)/(n-1), cy=y+bh/2, cx=[];
    let s="";
    nodes.forEach((nd,i)=>{
      const x=i*(bw+gap); cx.push(x+bw/2);
      s+=`<rect class="dg-box ${nd.cls||''}" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="13"/>`;
      const hasSub=!!nd.sub;
      s+=`<text class="${nd.big?'dg-em':'dg-label'}" x="${x+bw/2}" y="${y+(hasSub?24:34)}" text-anchor="middle">${esc(nd.label)}</text>`;
      if(hasSub) s+=`<text class="dg-sub" x="${x+bw/2}" y="${y+41}" text-anchor="middle">${esc(nd.sub)}</text>`;
      if(i<n-1){
        const x1=x+bw+5, x2=x+bw+gap-5;
        s+=`<line class="dg-arrow" x1="${x1}" y1="${cy}" x2="${x2}" y2="${cy}" marker-end="url(#ar)"/>`;
        const lab=opt.labels&&opt.labels[i];
        if(lab) s+=`<text class="dg-arrowlabel" x="${(x1+x2)/2}" y="${cy-9}" text-anchor="middle">${esc(lab)}</text>`;
      }
    });
    return {svg:s,cx,cy,W,bh,y};
  }

  /* ---- interactive "play" journey framework ---- */
  let _fxN=0;
  function journeyPlay(nodes, steps, opt){
    opt=opt||{};
    const W=opt.W||820, bw=opt.bw||150, bh=56, y=30;
    const n=nodes.length, gap=(W-n*bw)/(n-1), cy=y+bh/2, cx=[];
    const id="fx"+(_fxN++);
    let s="";
    nodes.forEach((nd,i)=>{ const x=i*(bw+gap); cx.push(x+bw/2);
      s+=`<rect id="${id}-n${i}" class="dg-box ${nd.cls||''}" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="13"/>`;
      s+=`<text class="dg-label" x="${x+bw/2}" y="${y+(nd.sub?23:33)}" text-anchor="middle" style="font-size:13px">${esc(nd.label)}</text>`;
      if(nd.sub) s+=`<text class="dg-sub" x="${x+bw/2}" y="${y+40}" text-anchor="middle">${esc(nd.sub)}</text>`;
      if(i<n-1) s+=`<line class="dg-arrow" x1="${x+bw+5}" y1="${cy}" x2="${x+bw+gap-5}" y2="${cy}"/>`;
    });
    const startX=cx[steps[0].i];
    s+=`<circle class="dg-pkt fx-pkt" cx="${startX}" cy="${cy}" r="9" style="opacity:0"/>`;
    const H=y+bh+30;
    const svg=`<svg class="dg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||opt.caption||"interactive diagram")}" preserveAspectRatio="xMidYMid meet">${ARROW}${s}</svg>`;
    const data=encodeURIComponent(JSON.stringify({steps:steps.map(st=>({x:cx[st.i],cap:st.cap,tone:st.tone||""})),startX}));
    return `<figure class="fig fx" data-fx="${data}"><div class="fig-scroll">${svg}</div><div class="fx-bar"><button class="fx-play" type="button">▶ Play</button><span class="fx-cap" aria-live="polite">${esc(opt.hint||"Press play to watch it flow.")}</span></div>${opt.caption?`<figcaption>${esc(opt.caption)}</figcaption>`:""}</figure>`;
  }
  function wireFigures(root){
    $$('figure[data-fx]',root).forEach(f=>{
      if(f.getAttribute('data-wired')) return; f.setAttribute('data-wired','1');
      let cfg; try{ cfg=JSON.parse(decodeURIComponent(f.getAttribute('data-fx'))); }catch(e){ return; }
      const pkt=f.querySelector('.fx-pkt'), cap=f.querySelector('.fx-cap'), btn=f.querySelector('.fx-play');
      if(!pkt||!btn||!cap) return;
      const steps=cfg.steps;
      const setTone=tn=>pkt.setAttribute('class','dg-pkt fx-pkt'+(tn?' '+tn:''));
      const resetPkt=()=>{ pkt.setAttribute('cx',cfg.startX); pkt.style.opacity=0; setTone(''); };
      const reducedRun=()=>{ pkt.style.opacity=1; const last=steps[steps.length-1]; pkt.setAttribute('cx',last.x); setTone(last.tone); cap.innerHTML=steps.map((st,i)=>`<span class="fx-step">${i+1}. ${esc(st.cap)}</span>`).join(''); btn.disabled=false; btn.textContent='↻ Replay'; };
      function play(){
        btn.disabled=true; resetPkt(); pkt.style.opacity=1;
        if(reduced()||!window.requestAnimationFrame){ reducedRun(); return; }
        let k=0;
        const hop=()=>{
          if(k>=steps.length){ btn.disabled=false; btn.textContent='↻ Replay'; return; }
          const st=steps[k], from=parseFloat(pkt.getAttribute('cx')||cfg.startX), to=st.x, dur=440; let t0=null;
          cap.textContent=st.cap; setTone(st.tone);
          const ease=x=>1-Math.pow(1-x,3);
          (function fr(ts){ if(t0===null)t0=ts; const p=Math.min(1,(ts-t0)/dur); pkt.setAttribute('cx',from+(to-from)*ease(p)); if(p<1) requestAnimationFrame(fr); else setTimeout(()=>{k++;hop();},620); })(performance&&performance.now?performance.now():0);
        };
        hop();
      }
      btn.addEventListener('click',play);
      resetPkt();
    });
  }
  function fwJourneyPlay(){ return journeyPlay(
    [{label:"Internet"},{label:"Router",sub:"firewall"},{label:"Windows",sub:"firewall"},{label:"Node.js",sub:":3000"},{label:"Website",cls:"ok"}],
    [{i:0,cap:"A visitor's request arrives from the Internet."},{i:1,cap:"Router firewall: :443/:3000 allowed ✓"},{i:2,cap:"Windows firewall: Node.js allowed ✓"},{i:3,cap:"Node.js is listening on :3000"},{i:4,cap:"Every guard said yes → your website loads 🌐",tone:"ok"}],
    {W:760,bw:128,caption:"Press Play to send a request through every guard — any single “no” would stop it.",aria:"animated packet passing through the layered firewalls",hint:"▶ Play to send a packet through the guards."}); }
  function dnsHierarchyPlay(){ return journeyPlay(
    [{label:"Resolver",cls:"accent"},{label:"Root",sub:"“.”"},{label:".com",sub:"TLD"},{label:"google's",sub:"name server"},{label:"142.250.1.14",cls:"ok"}],
    [{i:0,cap:"The resolver knows nothing yet — start at the top."},{i:1,cap:"Root: “I don't have it — ask the .com servers.”"},{i:2,cap:".com: “Ask google's own name server.”"},{i:3,cap:"google's server: “The IP is 142.250.1.14.”"},{i:4,cap:"Answer found — and cached for next time ✓",tone:"ok"}],
    {W:840,bw:150,caption:"Press Play to watch one lookup walk the hierarchy, referral by referral.",aria:"animated DNS resolution walking the hierarchy",hint:"▶ Play the lookup."}); }
  function tlsHandshakePlay(){ return journeyPlay(
    [{label:"your browser"},{label:"shop.dev",cls:"accent"}],
    [{i:0,cap:"① Browser: “Hello — let's start a secure session.”"},{i:1,cap:"② Server sends its certificate (padlock + CA signature)."},{i:0,cap:"③ Browser verifies it against trusted CAs ✓"},{i:1,cap:"④ Both agree a secret session key (the padlock trick)."},{i:0,cap:"⑤ From here on, everything is encrypted 🔒",tone:"ok"}],
    {W:560,bw:210,caption:"Press Play to watch the TLS handshake, step by step.",aria:"animated TLS handshake between browser and server",hint:"▶ Play the handshake."}); }
  function rpJourneyPlay(){ return journeyPlay(
    [{label:"Browser",sub:"Host: api.shop.dev"},{label:"reverse proxy",sub:":443",cls:"accent"},{label:"api app",sub:":4000",cls:"ok"}],
    [{i:0,cap:"A request for api.shop.dev arrives on :443."},{i:1,cap:"Proxy reads the Host header, matches a rule → :4000."},{i:2,cap:"Forwarded to the API app on :4000 ✓",tone:"ok"}],
    {W:720,bw:210,caption:"Press Play: the proxy routes by the Host name, not the IP.",aria:"animated reverse-proxy routing by host",hint:"▶ Play the request."}); }
  function cgnatPlay(){ return journeyPlay(
    [{label:"You"},{label:"home router",sub:"NAT"},{label:"ISP",sub:"CGNAT · shared",cls:"caution"},{label:"the world"}],
    [{i:3,cap:"A stranger sends an unsolicited packet to the shared public IP."},{i:2,cap:"ISP's CGNAT: no mapping for you — dropped here ✗",tone:"block"}],
    {W:800,bw:180,caption:"Press Play: an inbound knock dies at the carrier NAT, before it reaches your home.",aria:"animated inbound packet dropped at CGNAT",hint:"▶ Play the inbound knock."}); }
  function vpnJourneyPlay(){ return journeyPlay(
    [{label:"home server",sub:"behind CGNAT",cls:"block"},{label:"cloud VPN",sub:"public IP",cls:"accent"},{label:"the world"}],
    [{i:0,cap:"Your box dials OUT and holds a tunnel open (CGNAT allows outbound)."},{i:1,cap:"The tunnel lands at the public cloud server."},{i:2,cap:"A visitor arrives at the cloud server…"},{i:1,cap:"…and is relayed back down the tunnel your box opened ✓",tone:"ok"}],
    {W:760,bw:210,caption:"Press Play: you can't accept inbound, so you dial out — and the world reaches you through that pipe.",aria:"animated reachability through an outbound tunnel",hint:"▶ Play the tunnel."}); }
  function cfJourneyPlay(){ return journeyPlay(
    [{label:"visitor",sub:"shop.dev"},{label:"Cloudflare",sub:"TLS + routing",cls:"accent"},{label:"cloudflared",sub:"your box"},{label:"app :3000",cls:"ok"}],
    [{i:0,cap:"Visitor types shop.dev — DNS points it at Cloudflare (L2)."},{i:1,cap:"Cloudflare terminates HTTPS with a real cert, and routes (L3, L4)."},{i:2,cap:"Down the outbound tunnel that beats CGNAT (L5, L6)."},{i:3,cap:"Delivered to your app — zero inbound ports open (L1) ✓",tone:"ok"}],
    {W:880,bw:196,caption:"The full journey — every hop is a lesson you already climbed. Press Play.",aria:"animated full request journey through Cloudflare Tunnel",hint:"▶ Play the whole journey."}); }

  /* ---- firewall diagrams ---- */
  function journey(level){
    if(level==="recap") return fig(chain([{label:"Friend"},{label:"Internet"},{label:"Router"},{label:"Laptop"},{label:"Website",cls:"ok"}],{W:760}).svg,"0 0 760 110","Your website is reachable — a friend's request flows all the way to your laptop.","working request path");
    if(level==="guard-q") return fig(chain([{label:"Internet"},{label:"?",cls:"dashed",big:true},{label:"Your computer"}],{W:560,bw:150}).svg,"0 0 560 110","Anyone can knock on any door. What belongs in the empty box?","internet, unknown, computer");
    if(level==="guard") return fig(chain([{label:"Internet"},{label:"🛡 Firewall",cls:"accent"},{label:"Your computer"}],{W:560,bw:150}).svg,"0 0 560 110","The firewall sits between the Internet and your programs — every packet meets it first.","internet, firewall, computer");
    if(level==="chain") return fig(chain([{label:"Internet"},{label:"Router",sub:"firewall"},{label:"Windows",sub:"firewall"},{label:"Node.js",sub:":3000"},{label:"Website",cls:"ok"}],{W:760,bw:128}).svg,"0 0 760 110","A packet passes every guard in order. Any single “no” stops it.","layered firewalls");
    return "";
  }
  function twoPackets(){
    const card=(x,who)=>`<rect class="dg-box" x="${x}" y="20" width="250" height="140" rx="13"/>
      <text class="dg-sub" x="${x+18}" y="45">${who}</text>
      <text class="dg-label" x="${x+18}" y="74" style="font-size:12.5px">FROM  <tspan style="fill:var(--ink-faint)">some IP</tspan></text>
      <text class="dg-label" x="${x+18}" y="99" style="font-size:12.5px">TO    <tspan style="fill:var(--accent-strong)">your-IP : 80</tspan></text>
      <text class="dg-label" x="${x+18}" y="124" style="font-size:12.5px">ASK   <tspan style="fill:var(--ink-faint)">GET /</tspan></text>
      <text class="dg-sub" x="${x+18}" y="149">no name · no reason · no ID</text>`;
    return fig(card(20,"FRIEND'S REQUEST")+card(310,"HACKER'S REQUEST")+`<text class="dg-q" x="290" y="98" text-anchor="middle">=</text>`,"0 0 580 180","To the router these two packets are identical — it sees a destination, never a person.","identical packets");
  }
  function crowd(){
    const senders=[["Friend",30],["Stranger",82],["Bot",134],["Scanner",186]];
    let s="";
    senders.forEach(([w,y])=>{ s+=`<rect class="dg-box" x="16" y="${y-16}" width="150" height="34" rx="9"/><text class="dg-label" x="91" y="${y+5}" text-anchor="middle" style="font-size:13px">${w}</text><line class="dg-arrow" x1="168" y1="${y}" x2="300" y2="118" marker-end="url(#ar)"/>`; });
    s+=`<rect class="dg-box accent" x="300" y="96" width="150" height="44" rx="12"/><text class="dg-label" x="375" y="114" text-anchor="middle">Internet</text><text class="dg-sub" x="375" y="130" text-anchor="middle">no guest list</text>`;
    s+=`<line class="dg-arrow" x1="452" y1="118" x2="540" y2="118" marker-end="url(#ar)"/><rect class="dg-box" x="540" y="96" width="160" height="44" rx="12"/><text class="dg-label" x="620" y="114" text-anchor="middle">Your public IP</text><text class="dg-sub" x="620" y="130" text-anchor="middle">one open address</text>`;
    return fig(s,"0 0 716 210","Everyone — friend, stranger, bot, scanner — travels the same road to your one public address.","many senders one IP");
  }
  function building(sel){
    const doors=[["80","web",120],["443","secure",250],["3000","your app",380],["22","admin",510]];
    let s=`<rect class="dg-box" x="90" y="20" width="520" height="150" rx="14"/><text class="dg-label" x="350" y="50" text-anchor="middle">Your computer</text><text class="dg-sub" x="350" y="70" text-anchor="middle">one address · 103.24.56.11</text>`;
    doors.forEach(([p,cap,x])=>{ s+=`<g class="door ${sel===p?'sel':''} ${p==="22"?'caution':''}" data-port="${p}"><rect x="${x}" y="96" width="82" height="66" rx="8"/><text class="door-num" x="${x+41}" y="128" text-anchor="middle">${p}</text><text class="door-cap" x="${x+41}" y="148" text-anchor="middle">${cap}</text></g>`; });
    return fig(s,"0 0 700 190","One address, many numbered doors. A request must name the door (port) it wants.","building with doors");
  }
  function verdict(port, st){
    if(!st.routerAllow[port]) return {stop:1,tone:"block",title:"Blocked at the Router firewall",detail:`Port ${port} isn't in the router's allow-list, so the packet never even reaches your laptop.`};
    if(port===3000){
      if(!st.winAllowNode) return {stop:2,tone:"block",title:"Blocked at the Windows firewall",detail:"The router let it in, but Windows was told to Deny Node.js. Any single “no” stops the packet."};
      if(!st.nodeRunning) return {stop:3,tone:"block",title:"Nothing answered",detail:"Both firewalls allowed it — but Node.js isn't running, so nothing is listening on :3000."};
      return {stop:4,tone:"ok",title:"Reached your website 🌐",detail:"Router yes, Windows yes, Node.js listening on :3000. Every guard agreed."};
    }
    if(port===22) return {stop:3,tone:"caution",title:"Admin door left open",detail:"You allowed port 22 (remote admin / SSH) to the public Internet. No SSH runs in this demo, so it fails to connect — but in the real world, this is exactly how machines get taken over."};
    return {stop:3,tone:"block",title:`Nothing is listening on port ${port}`,detail:`The router allowed port ${port}, but no program on your laptop uses that door — nowhere to land.`};
  }

  /* ---- DNS diagrams ---- */
  function dnsRecap(){ return fig(chain([{label:"Friend"},{label:"103.24.56.11",cls:"accent",sub:"…a number?!"}],{W:520,bw:190}).svg,"0 0 520 110","To visit, your friend had to type a raw IP address.","friend typing raw ip"); }
  function dnsPhoneBook(){
    const rows=[["shop.dev","103.24.56.11"],["google.com","142.250.1.14"],["wikipedia.org","198.35.26.96"]];
    let s=`<rect class="dg-box" x="60" y="18" width="600" height="164" rx="14"/><text class="dg-sub" x="90" y="46">NAME</text><text class="dg-sub" x="420" y="46">ADDRESS</text><line class="dg-arrow" x1="80" y1="56" x2="640" y2="56"/>`;
    rows.forEach((r,i)=>{ const y=86+i*34; s+=`<text class="dg-label" x="90" y="${y}" style="font-family:var(--mono);font-size:13px">${r[0]}</text><text class="dg-arrowlabel" x="360" y="${y}">→</text><text class="dg-label" x="420" y="${y}" style="font-family:var(--mono);font-size:13px;fill:var(--accent-strong)">${r[1]}</text>`; });
    return fig(s,"0 0 720 196","A lookup table: every name paired with its number.","name to address table");
  }
  function dnsHosts(){
    let s="";
    [[40,"fresh"],[250,"fresh"],[460,"stale"]].forEach(([x,tag])=>{
      const bad=tag==="stale";
      s+=`<rect class="dg-box ${bad?'block':''}" x="${x}" y="30" width="180" height="96" rx="12"/><text class="dg-label" x="${x+90}" y="60" text-anchor="middle">a computer</text><text class="dg-sub" x="${x+90}" y="82" text-anchor="middle">hosts.txt copy</text><text class="dg-sub" x="${x+90}" y="104" text-anchor="middle" style="fill:${bad?'var(--block)':'var(--ok)'}">${bad?'✗ out of date':'✓ up to date'}</text>`;
    });
    return fig(s,"0 0 680 150","The old way: every computer kept its own copy of one shared file — and copies drift out of date.","hosts file copies drift");
  }
  function dnsAsk(){
    let s=`<rect class="dg-box" x="30" y="60" width="150" height="52" rx="12"/><text class="dg-label" x="105" y="91" text-anchor="middle">Your computer</text>`;

  function cfSimDiagram(st,r){
    const edge=st.dns==="cloudflare"?{label:"Cloudflare edge",sub:"certs · routing",cls:"accent"}:{label:"your home IP",sub:"CGNAT ✗",cls:"block"};
    const nodes=[{label:"visitor",sub:"shop.dev"},edge,{label:"your box",sub:st.tunnel?"cloudflared up":"cloudflared down"},{label:"app :3000",sub:st.app?"running":"stopped"}];
    if(r) nodes[r.stopIdx].cls=r.tone==="ok"?"ok":"block";
    const W=840,bw=192,bh=56,y=34,n=4,gap=(W-n*bw)/(n-1),cy=y+bh/2,cx=[];
    let s="";
    if(st.dns==="cloudflare"&&st.tunnel){ const x1=1*(bw+gap), x2=2*(bw+gap)+bw; s+=`<rect x="${x1}" y="${y-9}" width="${x2-x1}" height="${bh+18}" rx="15" fill="var(--accent-soft)" stroke="var(--accent)" stroke-dasharray="5 5"/><text class="dg-arrowlabel" x="${(x1+x2)/2}" y="${y-14}" text-anchor="middle" style="fill:var(--accent-strong)">outbound tunnel</text>`; }
    nodes.forEach((nd,i)=>{ const x=i*(bw+gap); cx.push(x+bw/2); s+=`<rect class="dg-box ${nd.cls||''}" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="13"/><text class="dg-label" x="${x+bw/2}" y="${y+23}" text-anchor="middle" style="font-size:13px">${esc(nd.label)}</text><text class="dg-sub" x="${x+bw/2}" y="${y+41}" text-anchor="middle">${esc(nd.sub)}</text>`; if(i<n-1){ s+=`<line class="dg-arrow" x1="${x+bw+5}" y1="${cy}" x2="${x+bw+gap-5}" y2="${cy}"/>`; } });
    s+=`<text class="dg-sub" x="${cx[2]}" y="${y+bh+20}" text-anchor="middle" style="fill:var(--${st.inboundOpen?'caution':'ok'})">inbound firewall: ${st.inboundOpen?"443 open":"all closed"}</text>`;
    return fig(s,"0 0 840 128","Assemble the stack and send a visitor — watch it serve, or fail at DNS, the tunnel, or the app.","cloudflare tunnel simulator");
  }
  function cfOutcome(st){
    if(st.dns!=="cloudflare") return {tone:"block",stopIdx:1,title:"Wrong DNS target",detail:"shop.dev's DNS points at your home IP — behind CGNAT and unreachable. Point the record at Cloudflare's edge instead."};
    if(!st.tunnel) return {tone:"block",stopIdx:2,title:"Tunnel down · error 1033",detail:"The request reached Cloudflare, but cloudflared isn't running — there's no open tunnel to relay it down to your box."};
    if(!st.app) return {tone:"block",stopIdx:3,title:"Bad Gateway · error 502",detail:"It came down the tunnel to your box, but nothing is listening on localhost:3000."};
    return {tone:"ok",stopIdx:3,title:"Served — over HTTPS",detail:"DNS → Cloudflare, TLS terminated at the edge with a real cert, routed down the outbound tunnel to cloudflared, delivered to your app on :3000."+(st.inboundOpen?" (That open :443 is needless attack surface — the tunnel is outbound-only, so close it.)":" Your firewall has zero inbound ports open — nothing to attack from outside.")};
  }

    { rail:"Scramble it", eyebrow:"predict", title:"Make your words unreadable to everyone but the site.",
      predict:{ q:"Simplest idea that actually works?", choices:[

    { rail:"The key problem", eyebrow:"predict", title:"But how do you BOTH get the same secret key?",

    { rail:"The padlock trick", eyebrow:"reveal", title:"The padlock trick.",
      lede:"The site has a <strong>keypair</strong>: an open <strong>padlock</strong> 🔓 it hands to anyone (its <em>public key</em>), and the only <strong>key</strong> 🗝 that opens it, which it never shares (its <em>private key</em>).",

        {t:"Only if they intercept it fast enough",ok:false,fb:"Speed doesn't help — without the private key the box is just noise."} ],
        why:"<p>You just shared a secret over an open wire. Both sides now hold the same <strong>session key</strong> and switch to fast ordinary encryption for the whole conversation. Problem solved… almost.</p>" } },
    { rail:"Whose padlock?", eyebrow:"predict", title:"Wait — whose padlock was that?",
      lede:"The café's router intercepted your request and handed you <strong>its own</strong> padlock, claiming to be shop.dev. Lock your secret with that, and you've handed it straight to the attacker.",
      diagram:()=>mitm(),
      predict:{ q:"You received a padlock claiming to be shop.dev's. How do you know it's genuine?", choices:[
        {t:"You can't — just hope",ok:false,fb:"That's the whole hole an attacker walks through."},
        {t:"shop.dev tells you it's really shop.dev",ok:false,fb:"An impostor would say the exact same thing. Remember from lesson 1 — the network carries no identity."},
        {t:"A trusted third party vouches that this padlock is really shop.dev's",ok:true,fb:"Yes. Identity has to come from someone you already trust — not from the stranger claiming it."} ],
        why:"<p>Encryption hides <em>what</em> you say, but not <em>who</em> you're saying it to. Since the network never proves identity, it must be <strong>vouched for by a party you already trust.</strong></p>" } },
    { rail:"Certificates", eyebrow:"reveal", title:"Enter the certificate.",
      lede:"A <strong>Certificate Authority (CA)</strong> is a trusted notary. shop.dev proves who it is to the CA once; the CA issues a <strong>certificate</strong> — shop.dev's padlock plus a tamper-proof signature: “I certify this padlock belongs to shop.dev.” Your browser ships trusting a list of CAs.",
      diagram:()=>certChain(),
      predict:{ q:"The café's impostor presents a padlock “for shop.dev” with no valid CA signature. Your browser…", choices:[

        {t:"asks the café whether it's legitimate",ok:false,fb:"Asking the attacker to vouch for itself — no."} ],
        why:"<p>The impostor can copy shop.dev's public padlock, but can't forge the CA's signature over it. No valid signature → your browser refuses. That's how man-in-the-middle dies.</p>" } },
    { rail:"What 🔒 means", eyebrow:"predict", title:"So what does the padlock in your address bar actually promise?",
      predict:{ q:"The 🔒 is showing. What does it guarantee?", choices:[

        {t:"The company behind it is a verified real business",ok:false,fb:"A standard certificate checks control of the domain, not who the company is."} ],
        why:"<p>The padlock certifies the <strong>connection</strong>, not the <strong>site</strong>. <code>paypaI-login.com</code> (capital&nbsp;I) can show a perfect padlock. HTTPS means “private, to this name” — never “this name is trustworthy.” Always read the actual domain.</p>" } },
    { rail:"The handshake", eyebrow:"challenge", title:"Trace the whole handshake.",
      lede:"Every HTTPS connection opens with this exchange. Play it, then predict each step.",
      diagram:()=>tlsHandshakePlay(),
      trace:[

          {t:"certificate (padlock + CA signature)",ok:true,fb:"Yes — identity first, before any secret is shared."},
          {t:"your password",ok:false,fb:"Nothing secret is sent yet — the browser hasn't even verified who this is."},

    { rail:"The wiretap", eyebrow:"challenge", title:"Sit on the wire. Try to steal the password.",

    { rail:"Next: Reverse proxies", eyebrow:"reveal", title:"Your site is private and trusted. Now you want a second app.",

  const RP=[
    { rail:"One door, many apps", eyebrow:"situation", title:"You want a second app on the same server.",
      lede:"shop.dev works — private, trusted, on :443. Now you add <strong>api.shop.dev</strong> on the same machine. Both have to answer on the one public :443.",
      diagram:()=>rpPortClash(),
      predict:{ q:"Can you just start both apps listening on port 443?", choices:[
        {t:"Yes — both bind :443",ok:false,fb:"The second one fails instantly: “address already in use.” A port has exactly one program behind it."},
        {t:"No — only one program can own a port at a time",ok:true,fb:"Right. Remember from Lesson 1: a port is a door, and only one program stands behind it."},
        {t:"Yes, if they take turns",ok:false,fb:"A listening socket is held continuously, not shared in turns."} ],
        why:"<p>Exactly one process can own :443. So you need <strong>one</strong> program on :443 that then hands each request to the right app behind it.</p>" } },
    { rail:"The front door", eyebrow:"predict", title:"One program owns :443. What should it DO with each request?",
      predict:{ q:"Pick the job for the program at the front door:", choices:[
        {t:"Be all the apps at once, in one giant program",ok:false,fb:"That merges unrelated apps into a mess — it's not routing."},
        {t:"Read each request and forward it to the right app behind it",ok:true,fb:"Yes — a dispatcher at the door that passes each request to the correct app."},
        {t:"Pick an app at random",ok:false,fb:"Then shop.dev might get the api app. Requests must go to the right place."} ],
        why:"<p>That dispatcher is a <strong>reverse proxy</strong>: one program on :443 that receives every request and forwards it to the correct app behind it.</p>",
        after:()=>rpFront() } },
    { rail:"Route on what?", eyebrow:"predict", title:"Both names point to the same IP. So how does the proxy tell them apart?",
      lede:"shop.dev and api.shop.dev both resolve — via DNS — to your <em>one</em> server's IP. The IP is identical for both.",
      diagram:()=>rpJourneyPlay(),
      predict:{ q:"What can the proxy look at to know which app a request wants?", choices:[
        {t:"The server's IP address",ok:false,fb:"Both names share one server IP (that's what DNS returns) — so the IP can't tell them apart."},
        {t:"The hostname the browser asked for — shop.dev vs api.shop.dev",ok:true,fb:"Yes. The name you typed rides along in the request, and the proxy reads it."},
        {t:"The visitor's identity",ok:false,fb:"The network carries no identity (Lesson 1) — and anyway that's who's calling, not which site they want."} ],
        why:"<p>Every request carries a <strong>Host</strong> field — the name you typed. The proxy matches it against a rule and forwards accordingly (it can also route on the <strong>path</strong>, like <code>/api/*</code>). Callback to DNS: many names → one IP is normal; the name lives in the request, and the proxy is what finally acts on it.</p>" } },
    { rail:"Certs, once", eyebrow:"predict", title:"Each app doing its own HTTPS would be a mess. Better idea?",
      diagram:()=>rpTls(),
      predict:{ q:"Where should HTTPS be handled?", choices:[

        {t:"The proxy handles HTTPS once at the front door, then talks plain HTTP to the local apps",ok:true,fb:"Yes — one place for all the certificates; the apps stay simple."},
        {t:"Drop HTTPS to keep it simple",ok:false,fb:"That throws away everything from Lesson 3."} ],
        why:"<p><strong>TLS termination:</strong> the proxy holds all the certificates, decrypts once at the edge, and forwards plain HTTP to the apps over the local loopback. Safe, because that hop never leaves the machine.</p>" } },
    { rail:"Shut the side doors", eyebrow:"predict", title:"Your apps listen on :3000 and :4000. Open those to the Internet too?",
      diagram:()=>rpPrivate(),
      predict:{ q:"Should the firewall expose :3000 and :4000 to the world?", choices:[
        {t:"Yes, expose 3000 and 4000 as well",ok:false,fb:"Then anyone can bypass the proxy — no TLS, no routing — and hit the raw app directly."},
        {t:"No — only :443/:80 are public; the proxy reaches the apps locally",ok:true,fb:"Right. One public front door; the apps have no public port of their own."},
        {t:"Doesn't matter, they're just apps",ok:false,fb:"It matters a lot — an open side door defeats the entire point of the front door."} ],
        why:"<p>The public firewall exposes <strong>only :443</strong> (→ the proxy). The apps aren't reachable from outside; only the local proxy talks to them. This is Lesson 1 and this lesson clicking together: the front door only works if the side doors are shut.</p>" } },
    { rail:"Why “reverse”?", eyebrow:"reveal", title:"Quick aside: why is it a “reverse” proxy?",
      lede:"A <strong>forward proxy</strong> sits in front of <em>clients</em> — one exit for many users (it hides who's asking). A <strong>reverse proxy</strong> sits in front of <em>servers</em> — one entrance for many apps (it represents them to the world). Same idea, opposite side of the conversation.",
      diagram:()=>fwdVsRev() },
    { rail:"Route it", eyebrow:"challenge", title:"You're the proxy. Route each request.",

        {q:"You exposed :3000 and :4000 through the firewall too. What's the risk?",a:"Visitors and attackers bypass the proxy entirely — no TLS, no routing — and hit the raw apps. The secure front door is pointless once the side doors are open."},

    { rail:"Next: CGNAT", eyebrow:"reveal", title:"This all assumed the world can reach your public IP. What if you don't have one?",
      lede:"Everything so far assumed you can port-forward :443 to your machine on a public IP. But call your ISP — many home and mobile connections don't hand out a public IP at all. You share one with hundreds of neighbors.",
      diagram:()=>cgnatBridge(),
      predict:{ q:"You share one public IP with a whole neighborhood and can't configure the ISP's shared router. Can the outside reach your server?", choices:[

        {t:"No — with no public address of your own, there's nothing to forward to; the outside can't start a connection to you",ok:true,fb:"Right. This quietly breaks port forwarding — and everything built on it."},

        why:"<div class='teaser'>world → <span class='glow'>🚧 shared ISP router</span> → you?</div><p>This is <strong>CGNAT</strong> (carrier-grade NAT), and it breaks the assumption underneath everything so far. Next lesson: how does anyone reach your server when you have no public address of your own?</p>",

  const CG=[
    { rail:"The shared IP", eyebrow:"situation", title:"Everything so far assumed a public IP was yours. What if it isn't?",
      lede:"Reverse proxies, HTTPS, port forwarding — all assumed you could point :443 at your box on a public IP. But many ISPs hand you a <strong>shared</strong> one.",
      diagram:()=>cgnatBridge(),
      predict:{ q:"You check your public IP; your neighbor checks theirs. What do you see?", choices:[
        {t:"Different IPs — everyone gets their own",ok:false,fb:"Not behind CGNAT — that's exactly what you don't get."},
        {t:"The same IP — you're sharing it with the neighborhood",ok:true,fb:"Right. Seeing a shared public IP is the classic tell that you're behind carrier-grade NAT."},
        {t:"No IP at all",ok:false,fb:"You do get one — you just share it with hundreds of homes."} ],
        why:"<p>Sharing one public IP is <strong>carrier-grade NAT (CGNAT)</strong>. To see why it kills incoming connections, we first need to understand NAT — the trick that lets many devices share one address.</p>" } },
    { rail:"Why share?", eyebrow:"predict", title:"Why would an ISP make hundreds of homes share one public IP?",
      predict:{ q:"Pick the real reason:", choices:[
        {t:"To save money on cabling",ok:false,fb:"Cabling isn't the issue."},
        {t:"Because public IPv4 addresses ran out — there aren't enough to go around",ok:true,fb:"Exactly. There are far more devices than addresses."},
        {t:"To make connections faster",ok:false,fb:"Sharing doesn't speed anything up — if anything it adds a hop."} ],
        why:"<p>IPv4 has only ~4.3 billion addresses — fewer than the world's devices. They're scarce, so ISPs share them. (The long-term fix is <strong>IPv6</strong>, with effectively unlimited addresses, but most access networks still lean on IPv4 — so sharing is today's reality.)</p>" } },
    { rail:"Sharing one address", eyebrow:"predict", title:"Your laptop and phone both use the home's one IP. How do replies find the right device?",
      lede:"Inside your home, each device has a private address (192.168.x). Outside, the home has just one public IP.",
      diagram:()=>natHome(),
      predict:{ q:"Both devices open google.com through the one public IP. Google replies. How does the router route each reply?", choices:[
        {t:"It guesses which device wanted it",ok:false,fb:"Guessing would mix up everyone's traffic."},
        {t:"It kept a note — “laptop started this one; send its reply to the laptop”",ok:true,fb:"Yes — a translation table records each outbound connection."},
        {t:"Both devices receive both replies",ok:false,fb:"That would be chaos, and a privacy nightmare."} ],
        why:"<p><strong>NAT (Network Address Translation):</strong> on the way out, the router swaps your private address for the public one and records the mapping in a table; when a reply returns, it looks up the table and forwards to the right device.</p>" } },
    { rail:"Out vs in", eyebrow:"predict", title:"A stranger sends an unsolicited packet to your home IP. The router checks its table…",
      diagram:()=>natAsym(),
      predict:{ q:"What happens?", choices:[
        {t:"It finds a matching entry and delivers it",ok:false,fb:"Nobody inside started this connection, so there is no entry to match."},
        {t:"It finds no entry — no idea which device it's for — and drops it",ok:true,fb:"Exactly. Without a mapping, the router has nowhere to send it."},
        {t:"It broadcasts the packet to every device",ok:false,fb:"That would be insecure and chaotic — routers don't do this."} ],
        why:"<p>This is the <strong>crucial asymmetry</strong>. A table entry is created only when a device <em>starts</em> a connection outward. So connections you start (outbound) get their replies back fine — but connections others start (inbound, unsolicited) have no mapping and get dropped. <strong>Outbound: easy. Inbound: blocked by default.</strong></p>" } },
    { rail:"How it used to work", eyebrow:"reveal", title:"So how did your website ever work?",
      lede:"You added a <strong>port-forward</strong> rule on <em>your</em> router: “any inbound :443 → send to my laptop.” A permanent, manual inbound entry — and it worked because you <strong>control your own router</strong>.",
      diagram:()=>pfRule(),
      predict:{ q:"Port forwarding worked because…?", choices:[
        {t:"you control your home router and could add the inbound rule",ok:true,fb:"Right — you punched one deliberate hole for :443, on a router that's yours."},
        {t:"inbound is allowed by default",ok:false,fb:"It isn't — you had to add the rule precisely because inbound is blocked by default."},
        {t:"the ISP configured it for you",ok:false,fb:"No — it was your rule, on your router."} ],
        why:"<p>One deliberate inbound hole, on a router you control, pointing at a public IP that's yours. Hold onto all three conditions — CGNAT breaks them.</p>" } },
    { rail:"CGNAT", eyebrow:"reveal", title:"Now the twist: your ISP does NAT too — on a shared IP you don't control.",
      lede:"Behind CGNAT there are <strong>two</strong> NATs stacked: your home router (as always), and then the ISP's carrier router, sharing one public IP across hundreds of homes.",
      diagram:()=>cgnatPlay(),
      predict:{ q:"You add a :443 port-forward on your home router. A stranger hits the shared public IP on :443. Reaches you?", choices:[

      trace:[
        {q:"Your laptop opens google.com (outbound), through home NAT and the CGNAT. Does the reply come back?", choices:[

          {t:"No — CGNAT blocks everything",ok:false,fb:"CGNAT only blocks unsolicited inbound; your own outbound is fine."},
          {t:"Only if you port-forward",ok:false,fb:"Outbound needs no rule at all."} ]},
        {q:"A stranger sends an unsolicited packet to the shared public IP :443. First stop is the ISP's CGNAT, which…", choices:[
          {t:"drops it — no matching outbound entry",ok:true,fb:"Yes. No mapping, so it dies right there."},

        {q:"Which direction still works, reliably, through CGNAT?", choices:[

          {t:"Inbound — connections others start",ok:false,fb:"That's exactly what CGNAT blocks."},

  function onNext(){

    if(nx>=0){ toast("Lesson complete!"); enterLesson(nx); } else { const allDone=COURSE.every(l=>l.status!=="ready"||(prog[l.id]&&prog[l.id].done)); toast(allDone?"🎉 You finished the whole course!":"Back to the path."); gotoHub(); }

  function updateNav(){

  /* ============ LESSON STEP ============ */

  function eyebrowText(k){ return {situation:"Situation",predict:"Predict",reveal:"Discovered",challenge:"Your turn"}[k]||k; }

  /* ---- predict ---- */
  function renderPredict(p){
    const keys=["A","B","C","D"];
    return `<div style="margin-top:6px"><p style="font-weight:600;font-size:16px;margin:0 0 14px">${p.q}</p><div class="choices">`+
      p.choices.map((c,i)=>`<button class="choice" data-i="${i}" data-ok="${c.ok?1:0}"><span class="key">${keys[i]}</span><span class="ctext">${c.t}<span class="fb">${c.fb}</span></span></button>`).join("")+
      `</div><div class="why" id="whyBox"><h4>Why</h4>${p.why}</div><div id="whyAfter"></div></div>`;
  }
  function wirePredict(p){
    const box=$("#stage"); let first=false;
    const revealAll=()=>{
      $$(".choice",box).forEach(b=>{ b.classList.add("locked"); if(b.dataset.ok==="1") b.classList.add("reveal-ok","show-fb"); });
      $("#whyBox").classList.add("show");
      if(p.after&&$("#whyAfter")&&!$("#whyAfter").innerHTML){ $("#whyAfter").innerHTML=p.after(); wireFigures(box); }
    };
    $$(".choice",box).forEach(btn=>btn.addEventListener("click",()=>{
      const ok=btn.dataset.ok==="1";
      btn.classList.add("show-fb",ok?"picked-ok":"picked-bad");
      if(!first){ first=true; revealAll(); markAnswered(); if(ok) toast("Nice — you predicted it."); }
    }));
    if(P().answered[P().idx]) revealAll();
  }

  /* ---- building ---- */
  function wireBuilding(){
    const behind={"80":"Port 80 → your public web page (HTTP).","443":"Port 443 → your secure web page (HTTPS).","3000":"Port 3000 → your Node.js app in development.","22":"⚠ Port 22 → SSH: remote control of the whole machine."};
    const cap=$(".fig figcaption");
    const info=document.createElement("p"); info.className="hint"; info.style.textAlign="center"; info.style.marginTop="-8px";
    if(cap) cap.insertAdjacentElement("afterend",info);
    $$(".door").forEach(d=>d.addEventListener("click",()=>{ $$(".door").forEach(x=>x.classList.remove("sel")); d.classList.add("sel"); info.textContent=behind[d.dataset.port]||""; info.style.color=d.dataset.port==="22"?"var(--caution)":"var(--ink-soft)"; }));
  }

  /* ---- drill ---- */
  function mountDrill(items){
    const mount=$("#drillMount"); let i=0; const results=[];
    function paint(){
      if(i>=items.length){ const good=results.filter(Boolean).length;
        mount.innerHTML=`<div class="drill"><div class="drill-port" style="font-size:26px">${good} / ${items.length} correct</div><p class="lede" style="margin:0 auto">${good===items.length?"Flawless. You're reading the rules like a firewall does — matching the door number, nothing else.":"Good — the only question that matters is: is this door on the allow-list?"}</p></div>`;
        markAnswered(); return; }
      const it=items[i];
      mount.innerHTML=`<div class="drill"><div class="drill-progress">${items.map((_,k)=>`<i class="${k<i?(results[k]?'ok':'bad'):k===i?'cur':''}"></i>`).join("")}</div><div class="drill-knock">incoming knock on port</div><div class="drill-port">${it.port}</div><div class="drill-btns"><button class="db allow" data-a="allow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Allow</button><button class="db block" data-a="block"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg> Block</button></div><div class="drill-fb" id="dfb"></div></div>`;
      $$(".db",mount).forEach(b=>b.addEventListener("click",()=>{ const correct=b.dataset.a===it.answer; results[i]=correct; const fb=$("#dfb",mount); fb.className="drill-fb "+(correct?"ok":"bad"); fb.textContent=(correct?"✓ ":"✗ ")+it.fb; $$(".db",mount).forEach(x=>x.disabled=true); setTimeout(()=>{ i++; paint(); }, correct?1050:1850); }));
    }
    paint();
  }

  /* ---- trace (sequential MCQ) ---- */
  function mountTrace(items){
    const mount=$("#traceMount"); let i=0; const keys=["A","B","C"];

      if(i>=items.length){ mount.innerHTML=`<div class="drill"><div style="font-size:20px;font-weight:700;margin-bottom:6px">Full lookup traced ✓</div><p class="lede" style="margin:0 auto">Root → .com → google's server → the IP. Each level only pointed to the next — until the last one knew the answer.</p></div>`; markAnswered(); return; }
      const it=items[i];
      mount.innerHTML=`<div><div class="drill-progress" style="margin-bottom:16px">${items.map((_,k)=>`<i class="${k<i?'ok':k===i?'cur':''}"></i>`).join("")}</div><p class="trace-q">${it.q}</p><div class="choices">${it.choices.map((c,k)=>`<button class="choice" data-i="${k}" data-ok="${c.ok?1:0}"><span class="key">${keys[k]}</span><span class="ctext">${c.t}<span class="fb">${c.fb}</span></span></button>`).join("")}</div><div class="trace-next" id="tnext"><button class="btn primary" id="tnextBtn">Next step <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button></div></div>`;
      let done=false;

      $("#tnextBtn",mount).addEventListener("click",()=>{ i++; paint(); });

  /* ---- firewall sim ---- */
  function renderFwSim(){
    return `<div class="sim"><div class="sim-controls">
      <div class="ctrl-row"><div class="ctrl-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> Visitor knocks on door</div><div class="seg" id="portSeg">${[80,443,3000,22,9999].map(p=>`<button data-p="${p}">${p}</button>`).join("")}</div></div>
      <div class="ctrl-row"><div class="ctrl-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 4.5-3.2 7.7-8 9-4.8-1.3-8-4.5-8-9V7l8-4Z"/></svg> Router firewall — allowed doors</div><div class="seg gate" id="routerSeg">${[80,443,3000,22].map(p=>`<button data-p="${p}">${p}</button>`).join("")}</div></div>
      <div class="ctrl-row"><div class="ctrl-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8"/></svg> Windows firewall — Node.js</div><div class="seg gate" id="winSeg"><button data-v="1">Allow</button><button data-v="0">Deny</button></div></div>
      <div class="ctrl-row"><div class="ctrl-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10M6 6a8 8 0 1 0 12 0"/></svg> Node.js service (:3000)</div><div class="seg gate" id="nodeSeg"><button data-v="1">Running</button><button data-v="0">Stopped</button></div></div>
      <button class="send-btn" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg> Send packet</button>
    </div><div id="simDiagram"></div><div class="verdict" id="verdict"></div><div class="goals" id="goals"></div></div>`;
  }
  function mountFwSim(){
    if(!simMem.firewall) simMem.firewall={port:3000,routerAllow:{80:true,443:true,3000:false,22:false},winAllowNode:false,nodeRunning:true};
    const st=simMem.firewall;
    const paintControls=()=>{
      $$("#portSeg button").forEach(b=>b.classList.toggle("on",+b.dataset.p===st.port));
      $$("#routerSeg button").forEach(b=>{ const on=st.routerAllow[+b.dataset.p]; b.className=on?"on allow":"on block"; });
      $$("#winSeg button").forEach(b=>{ const v=+b.dataset.v===1; const on=v===st.winAllowNode; b.className=on?(st.winAllowNode?"on allow":"on block"):""; });
      $$("#nodeSeg button").forEach(b=>{ const v=+b.dataset.v===1; const on=v===st.nodeRunning; b.className=on?(st.nodeRunning?"on allow":"on block"):""; });
    };
    const paintDiagram=(r)=>{
      const nodes=[{label:"Internet"},
        {label:"Router",sub:"firewall",cls:r?(st.routerAllow[st.port]?"ok":"block"):""},
        {label:"Windows",sub:"firewall",cls:r&&r.stop>=2?(r.stop===2?"block":(st.winAllowNode?"ok":"")):""},
        {label:"Node.js",sub:":3000",cls:r&&r.stop>=3?(r.stop===3?(r.tone==="caution"?"caution":"block"):(st.nodeRunning?"ok":"")):""},
        {label:"Website",cls:r&&r.stop===4?"ok":""}];
      const c=chain(nodes,{W:780,bw:130});
      const stopX=r?c.cx[Math.min(r.stop,c.cx.length-1)]:24;
      $("#simDiagram").innerHTML=fig(c.svg+`<circle id="pkt" class="dg-pkt ${r?r.tone:''}" cx="24" cy="${c.cy}" r="9"/>`,"0 0 780 110","Set the guards, choose a door, send a packet — watch where it stops.","packet trace simulator");
      return stopX;
    };
    const paintGoals=()=>{ const web=verdict(3000,st).stop===4, g1=web, g2=web&&st.routerAllow[22]===false;
      $("#goals").innerHTML=`<h4>Challenges</h4><div class="goal ${g1?'met':''}"><span class="gbox">${g1?chk():''}</span> Make the website reachable on :3000</div><div class="goal ${g2?'met':''}"><span class="gbox">${g2?chk():''}</span> Keep the site up while the admin door (22) is shut</div>`; };
    const chk=()=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    const clearV=()=>{ $("#verdict").className="verdict"; paintDiagram(null); };
    $$("#portSeg button").forEach(b=>b.addEventListener("click",()=>{ st.port=+b.dataset.p; paintControls(); clearV(); }));
    $$("#routerSeg button").forEach(b=>b.addEventListener("click",()=>{ const p=+b.dataset.p; st.routerAllow[p]=!st.routerAllow[p]; paintControls(); paintGoals(); clearV(); }));
    $$("#winSeg button").forEach(b=>b.addEventListener("click",()=>{ st.winAllowNode=+b.dataset.v===1; paintControls(); paintGoals(); clearV(); }));
    $$("#nodeSeg button").forEach(b=>b.addEventListener("click",()=>{ st.nodeRunning=+b.dataset.v===1; paintControls(); paintGoals(); clearV(); }));
    $("#sendBtn").addEventListener("click",()=>{
      const r=verdict(st.port,st), stopX=paintDiagram(r), pkt=$("#pkt");
      const showV=()=>{ const v=$("#verdict"); v.className="verdict show "+r.tone; const ic=r.tone==="ok"?'<path d="M20 6L9 17l-5-5"/>':r.tone==="caution"?'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 4h.01"/>':'<path d="M6 6l12 12M18 6L6 18"/>'; v.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg><span><b>${r.title}</b>${r.detail}</span>`; paintGoals(); markAnswered(); };
      if(reduced()||!pkt||!window.requestAnimationFrame){ if(pkt)pkt.setAttribute("cx",stopX); showV(); return; }
      const x0=24,dur=680; let t0=null; const ease=t=>1-Math.pow(1-t,3);
      (function frame(ts){ if(t0===null)t0=ts; const p=Math.min(1,(ts-t0)/dur); pkt.setAttribute("cx",x0+(stopX-x0)*ease(p)); if(p<1) requestAnimationFrame(frame); else showV(); })(performance&&performance.now?performance.now():0);
    });
    paintControls(); paintDiagram(null); paintGoals();
  }

  /* ---- DNS sim ---- */
  function renderDnsSim(){
    return `<div class="sim"><div class="sim-controls">
      <div class="ctrl-row"><div class="ctrl-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg> Resolve which name?</div><div class="seg" id="domSeg"><button data-d="google.com">google.com</button><button data-d="shop.dev">shop.dev</button><button data-d="nope.zzz">nope.zzz</button></div></div>
      <div class="cache-line" id="cacheLine"></div>
      <div style="display:flex;gap:10px;margin-top:12px"><button class="send-btn" id="resolveBtn" style="flex:1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg> Resolve</button><button class="btn" id="clearCache">Clear cache</button></div>
    </div>
    <div id="dnsDiagram"></div>
    <ol class="hoplog" id="hoplog"><li style="color:var(--ink-faint)">Pick a name and press Resolve to watch the lookup.</li></ol>

  function dnsBoxes(hotId,answered){
    const nodes=[{label:"Browser",id:"b-browser"},{label:"Resolver",sub:"recursive",id:"b-resolver",cls:"accent"},{label:"Root",sub:"“.”",id:"b-root"},{label:".com",sub:"TLD",id:"b-tld"},{label:"authoritative",sub:"the site's server",id:"b-auth"}];
    const W=820,bw=150,bh=56,y=30,n=nodes.length,gap=(W-n*bw)/(n-1),cy=y+bh/2; let s="";
    nodes.forEach((nd,i)=>{ const x=i*(bw+gap); const hot=nd.id===hotId?"hot":""; s+=`<rect id="${nd.id}" class="dg-box ${nd.cls||''} ${hot}" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="13"/><text class="dg-label" x="${x+bw/2}" y="${y+(nd.sub?24:34)}" text-anchor="middle" style="font-size:13.5px">${nd.label}</text>${nd.sub?`<text class="dg-sub" x="${x+bw/2}" y="${y+41}" text-anchor="middle">${nd.sub}</text>`:""}`; if(i<n-1){const x1=x+bw+5,x2=x+bw+gap-5;s+=`<line class="dg-arrow" x1="${x1}" y1="${cy}" x2="${x2}" y2="${cy}"/>`;} });
    if(answered) s+=`<text class="dg-sub" x="${W/2}" y="${y+bh+20}" text-anchor="middle" style="fill:var(--ok);font-size:12.5px">answer: ${esc(answered)}</text>`;
    return fig(s,"0 0 820 120","The recursive resolver does the walking for you — out to each level and back.","dns resolver simulator");
  }

    $("#resolveBtn").addEventListener("click",()=>{
      const cached=!!st.cache[st.domain];

      const log=$("#hoplog"); log.innerHTML=""; $("#dnsVerdict").className="verdict"; $("#resolveBtn").disabled=true;
      const finish=()=>{
        if(plan.result){ if(cached) st.didHit=true; else { st.didCold=true; st.cache[st.domain]=true; } }

    const chk=()=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    const paintControls=()=>{
      $$("#cfDns button").forEach(b=>b.classList.toggle("on",b.dataset.v===st.dns));
      $$("#cfTunnel button").forEach(b=>{ const v=b.dataset.v==="1"; const on=v===st.tunnel; b.className=on?(st.tunnel?"on allow":"on block"):""; });
      $$("#cfApp button").forEach(b=>{ const v=b.dataset.v==="1"; const on=v===st.app; b.className=on?(st.app?"on allow":"on block"):""; });
      $$("#cfFw button").forEach(b=>{ const isOpen=b.dataset.v==="1"; const on=isOpen===st.inboundOpen; b.className=on?(isOpen?"on block":"on allow"):""; });
    };
    const paintGoals=()=>{ $("#cfGoals").innerHTML=`<h4>Challenges</h4><div class="goal ${st.didServe?'met':''}"><span class="gbox">${st.didServe?chk():''}</span> Serve shop.dev end-to-end (200 over https)</div><div class="goal ${st.didZero?'met':''}"><span class="gbox">${st.didZero?chk():''}</span> Do it with zero inbound ports open</div>`; };
    const reset=()=>{ $("#cfDiagram").innerHTML=cfSimDiagram(st,null); $("#cfVerdict").className="verdict"; };
    $$("#cfDns button").forEach(b=>b.addEventListener("click",()=>{ st.dns=b.dataset.v; paintControls(); reset(); }));
    $$("#cfTunnel button").forEach(b=>b.addEventListener("click",()=>{ st.tunnel=b.dataset.v==="1"; paintControls(); reset(); }));
    $$("#cfApp button").forEach(b=>b.addEventListener("click",()=>{ st.app=b.dataset.v==="1"; paintControls(); reset(); }));
    $$("#cfFw button").forEach(b=>b.addEventListener("click",()=>{ st.inboundOpen=b.dataset.v==="1"; paintControls(); reset(); }));
    $("#cfSend").addEventListener("click",()=>{
      const r=cfOutcome(st);
      $("#cfDiagram").innerHTML=cfSimDiagram(st,r);
      if(r.tone==="ok"){ st.didServe=true; if(!st.inboundOpen) st.didZero=true; }
      paintGoals();
      const v=$("#cfVerdict"); v.className="verdict show "+r.tone;
      const ic=r.tone==="ok"?'<path d="M20 6L9 17l-5-5"/>':'<path d="M6 6l12 12M18 6L6 18"/>';
      v.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg><span><b>${r.title}</b>${r.detail}</span>`;
      markAnswered();
    });
    paintControls(); reset(); paintGoals();
  }

  /* ---- toast / theme / rail ---- */
  let tt=null;
  function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1800); }
  function toggleTheme(){ const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"); const nx=cur==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",nx); try{localStorage.setItem("groundup.theme",nx);}catch(e){} }
  function openRail(){ document.body.classList.add("rail-open"); }
  function closeRail(){ document.body.classList.remove("rail-open"); }
  $("#scrim").addEventListener("click",closeRail);

  document.addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return; if(screen!=="lesson")return;
    if(e.key==="ArrowRight"&&canContinue()) onNext();
    else if(e.key==="ArrowLeft"&&P().idx>0) go(P().idx-1);
    else if(/^[1-4]$/.test(e.key)){ const c=$$(".card .choices .choice")[+e.key-1]; if(c&&!c.classList.contains("locked"))c.click(); } });

  // test hook
  window.__t={COURSE,verdict,dnsPlan,httpsOutcome,proxyRoute,natOutcome,vpnOutcome,cfOutcome,enterLesson,gotoHub,go,getScreen:()=>screen,getActive:()=>active,P};

  load(); renderAll();
})();
</script>
